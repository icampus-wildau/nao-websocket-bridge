name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install nao-websocket-bridge-protocol
      - run: python -m unittest discover -s tests -v
      - run: for script in packaging/*.sh; do sh -n "$script"; done
